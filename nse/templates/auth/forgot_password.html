{% extends "base.html" %}
{% block title %}Forgot Password — {{ COMPANY_NAME }}{% endblock %}
{% block content %}
<section class="max-w-md mx-auto px-4 py-14">
  <div class="card p-8 shadow-sm border border-slate-200 bg-white rounded-2xl">
    <div class="text-center mb-6">
      <div class="w-12 h-12 bg-amber-50 text-amber-600 font-bold text-2xl flex items-center justify-center rounded-xl mx-auto border border-amber-200">
        🔑
      </div>
      <h1 class="text-2xl font-extrabold text-ink mt-3">Reset Staff Password</h1>
      <p class="text-ink-subtle text-sm mt-1">Enter your registered staff mobile number to receive a verification OTP.</p>
    </div>

    <form method="post" action="{{ url_for('auth.forgot_password_request') }}" class="space-y-4">
      <label class="block">
        <span class="text-sm font-semibold text-ink">Registered Staff Mobile</span>
        <div class="relative mt-1.5 flex rounded-lg shadow-xs">
          <span class="inline-flex items-center px-3.5 rounded-l-lg border border-r-0 border-slate-300 bg-slate-100 text-slate-700 font-semibold text-sm select-none">
            +91
          </span>
          <input type="tel" name="phone" required maxlength="10" inputmode="numeric"
                 pattern="[0-9]{10}" placeholder="9825000001" autofocus
                 value="{{ phone or '' }}"
                 class="w-full px-3 py-2.5 rounded-r-lg border border-slate-300 focus:border-primary focus:ring-1 focus:ring-primary font-mono text-base tracking-wide"
                 oninput="this.value = this.value.replace(/[^0-9]/g, '').slice(0, 10)">
        </div>
        <span class="text-xs text-ink-subtle mt-1.5 block">We will verify your staff identity via mobile OTP.</span>
      </label>

      <button class="btn btn-primary w-full py-2.5 text-base font-semibold shadow-sm">
        Send Reset OTP
      </button>

      <div class="text-center pt-2">
        <a href="{{ url_for('auth.login', phone=phone or '') }}" class="text-sm font-semibold text-primary hover:underline">
          ← Back to Sign In
        </a>
      </div>
    </form>
  </div>
</section>
{% endblock %}
